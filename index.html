<!DOCTYPE html>
<!-- 蛋蛋餐馆 · H5 扫码点餐（测试版 v3）
     用法1（最简单）：把本文件发到手机，用浏览器打开即可点餐（无桌号时默认 A01 测试桌）
     用法2（贴桌二维码）：网址后面加 ?table=桌号，如 ...?table=A01 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>蛋蛋餐馆 · 扫码点餐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #F6F6F6; color: #333; padding-bottom: 130px; }
  .header { background: linear-gradient(135deg, #FF7A00, #FF9A3C); color: #fff; padding: 40px 20px 24px; }
  .header h1 { font-size: 24px; }
  .table-tag { display: inline-block; margin-top: 10px; padding: 4px 14px; background: rgba(255,255,255,.25); border-radius: 20px; font-size: 13px; }
  .cate-bar { display: flex; gap: 10px; background: #fff; padding: 14px 16px 0; overflow-x: auto; }
  .cate-item { flex-shrink: 0; padding: 8px 18px; border-radius: 20px; background: #F2F2F2; color: #666; font-size: 14px; }
  .cate-item.active { background: #FF7A00; color: #fff; }
  .dish-item { display: flex; align-items: center; justify-content: space-between; background: #fff; margin: 12px 14px; padding: 16px; border-radius: 12px; }
  .dish-name { font-size: 17px; font-weight: bold; }
  .dish-desc { font-size: 12px; color: #999; margin: 6px 0; }
  .price { color: #FF4D00; font-weight: bold; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .step-btn { width: 30px; height: 30px; line-height: 28px; text-align: center; border: 1px solid #ddd; border-radius: 50%; color: #666; cursor: pointer; user-select: none; }
  .step-btn.add { background: #FF7A00; border-color: #FF7A00; color: #fff; }
  .step-count { min-width: 28px; text-align: center; font-weight: bold; }
  .add-btn { background: #FF7A00; color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 14px; cursor: pointer; }
  .cart-bar { position: fixed; left: 14px; right: 14px; bottom: 14px; height: 60px; background: #fff; border-radius: 30px; display: flex; align-items: center; padding: 0 8px 0 20px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .cart-icon { position: relative; font-size: 24px; }
  .cart-badge { position: absolute; top: -6px; right: -10px; min-width: 18px; height: 18px; line-height: 18px; text-align: center; background: #FF4D00; color: #fff; border-radius: 9px; font-size: 11px; padding: 0 4px; }
  .cart-total { flex: 1; margin-left: 14px; font-size: 18px; }
  .cart-go { background: #FF7A00; color: #fff; border: none; border-radius: 24px; height: 46px; padding: 0 30px; font-size: 15px; cursor: pointer; }
  .cart-go:disabled { background: #ddd; }
  .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10; }
  .sheet { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 20px 20px 0 0; z-index: 11; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 70vh; overflow-y: auto; }
  .sheet.open, .mask.open { display: block; }
  .sheet-title { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 12px; }
  .cart-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F0F0F0; }
  .remark-row { margin-top: 16px; display: flex; align-items: center; gap: 10px; }
  .remark-row input { flex: 1; background: #F6F6F6; border: none; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  .total-row { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; font-size: 15px; color: #666; }
  .total-row .price { font-size: 20px; }
  .submit { width: 100%; height: 48px; background: #FF7A00; color: #fff; border: none; border-radius: 24px; font-size: 16px; cursor: pointer; }
  .order-card { background: #fff; margin: 12px 14px; padding: 16px; border-radius: 12px; }
  .order-head { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
  .status { font-size: 12px; padding: 3px 10px; border-radius: 12px; background: #FFF3E0; color: #FF7A00; }
  .order-row { display: flex; justify-content: space-between; color: #666; font-size: 13px; padding: 4px 0; }
  .order-foot { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid #F0F0F0; color: #999; font-size: 12px; align-items: center; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #eee; }
  .tabs .tab { flex: 1; text-align: center; padding: 12px 0 16px; color: #999; font-size: 14px; cursor: pointer; }
  .tabs .tab.active { color: #FF7A00; font-weight: bold; }
  .empty { text-align: center; color: #999; padding: 60px 0; font-size: 14px; }
  .view { display: none; } .view.active { display: block; }
  .toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.75); color: #fff; padding: 12px 24px; border-radius: 10px; font-size: 14px; z-index: 99; display: none; }
  .err-bar { background: #FFEBEE; color: #C62828; padding: 12px 16px; font-size: 13px; word-break: break-all; }
</style>
</head>
<body>
  <div class="header">
    <h1>🍳 蛋蛋餐馆</h1>
    <div class="table-tag" id="tableTag">桌号：A01（默认测试桌）</div>
  </div>

  <!-- 点餐视图 -->
  <div class="view active" id="menuView">
    <div class="cate-bar" id="cateBar"></div>
    <div id="dishList">
      <!-- 静态兜底：万一程序没跑起来，至少能看到菜品，并提示换浏览器 -->
      <div class="dish-item">
        <div>
          <div class="dish-name">米饭</div>
          <div class="dish-desc">现煮米饭</div>
          <div class="price">¥3</div>
        </div>
      </div>
      <div class="dish-item">
        <div>
          <div class="dish-name">麻辣豆腐</div>
          <div class="dish-desc">嫩豆腐，微辣下饭</div>
          <div class="price">¥12</div>
        </div>
      </div>
      <div class="dish-item">
        <div>
          <div class="dish-name">宫保鸡丁</div>
          <div class="dish-desc">花生鸡丁，微辣</div>
          <div class="price">¥18</div>
        </div>
      </div>
      <div class="empty">如果看不到“加菜”按钮，请用手机浏览器（如 Chrome、QQ浏览器、夸克）打开本页面，不要在微信里直接预览文件。</div>
    </div>
    <div class="cart-bar">
      <div class="cart-icon">🛒<span class="cart-badge" id="cartBadge" style="display:none">0</span></div>
      <div class="cart-total price" id="cartTotal">¥0</div>
      <button class="cart-go" id="cartGo" onclick="openCart()" disabled>去下单</button>
    </div>
  </div>

  <!-- 订单视图 -->
  <div class="view" id="orderView">
    <div id="orderList"></div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchView('menuView', this)">点餐</div>
    <div class="tab" onclick="switchView('orderView', this)">我的订单</div>
  </div>

  <!-- 购物车弹层 -->
  <div class="mask" id="mask" onclick="closeCart()"></div>
  <div class="sheet" id="cartSheet">
    <div class="sheet-title">购物车</div>
    <div id="cartRows"></div>
    <div class="remark-row">备注：<input id="remarkInput" placeholder="如：少辣、不要香菜"></div>
    <div class="total-row"><span id="totalCount"></span><span>合计：<span class="price" id="sheetTotal"></span></span></div>
    <button class="submit" onclick="submitOrder()">提交订单（测试模式，不收钱）</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ========== 出错时把原因显示在页面顶部（方便排查，正式版可去掉）==========
window.onerror = function (msg, url, line) {
  var bar = document.createElement('div')
  bar.className = 'err-bar'
  bar.textContent = '页面出错：' + msg + '（第 ' + line + ' 行）'
  document.body.insertBefore(bar, document.body.firstChild)
}

// ========== 本地存储的安全封装 ==========
// 部分手机浏览器直接打开本地文件时会禁止 localStorage，做兜底防止整个页面崩掉
var memStore = {}
var store = {
  get: function (k, def) {
    try { var v = window.localStorage.getItem(k); return v === null ? def : v } catch (e) { return memStore[k] !== undefined ? memStore[k] : def }
  },
  set: function (k, v) {
    try { window.localStorage.setItem(k, v) } catch (e) { memStore[k] = v }
  }
}

// ========== 菜品数据（测试用，后续接入后端后从服务端拉取）==========
var MENU = [
  { id: 'rice',           name: '米饭',     desc: '现煮米饭',       price: 3,  category: '主食' },
  { id: 'mala-doufu',     name: '麻辣豆腐', desc: '嫩豆腐，微辣下饭', price: 12, category: '热菜' },
  { id: 'gongbao-jiding', name: '宫保鸡丁', desc: '花生鸡丁，微辣',   price: 18, category: '热菜' }
]

// 桌号：优先从网址 ?table=A01 读取；没有就默认 A01（测试模式，方便直接打开就能点）
var paramTable = ''
try { paramTable = new URLSearchParams(location.search).get('table') || '' } catch (e) {}
var tableNo = paramTable || 'A01'
document.getElementById('tableTag').textContent = paramTable ? ('桌号：' + tableNo) : '桌号：A01（默认测试桌）'

var cart = {}   // { dishId: count }
var currentCate = '全部'

// ========== 渲染 ==========
function render() {
  // 分类
  var cates = ['全部'].concat(MENU.map(function (d) { return d.category }).filter(function (v, i, a) { return a.indexOf(v) === i }))
  document.getElementById('cateBar').innerHTML = cates.map(function (c) {
    return '<div class="cate-item ' + (c === currentCate ? 'active' : '') + '" onclick="setCate(\'' + c + '\')">' + c + '</div>'
  }).join('')

  // 菜品
  var list = currentCate === '全部' ? MENU : MENU.filter(function (d) { return d.category === currentCate })
  document.getElementById('dishList').innerHTML = list.map(function (d) {
    var count = cart[d.id] || 0
    var right = count > 0
      ? '<div class="stepper">' +
          '<div class="step-btn" onclick="changeCount(\'' + d.id + '\',-1)">−</div>' +
          '<div class="step-count">' + count + '</div>' +
          '<div class="step-btn add" onclick="changeCount(\'' + d.id + '\',1)">＋</div>' +
        '</div>'
      : '<div class="add-btn" onclick="changeCount(\'' + d.id + '\',1)">＋ 加菜</div>'
    return '<div class="dish-item">' +
      '<div>' +
        '<div class="dish-name">' + d.name + '</div>' +
        '<div class="dish-desc">' + d.desc + '</div>' +
        '<div class="price">¥' + d.price + '</div>' +
      '</div>' + right + '</div>'
  }).join('')

  // 底部栏
  var count = 0
  var total = 0
  Object.keys(cart).forEach(function (k) {
    count += cart[k]
    var dish = MENU.filter(function (d) { return d.id === k })[0]
    if (dish) total += dish.price * cart[k]
  })
  document.getElementById('cartBadge').style.display = count ? 'block' : 'none'
  document.getElementById('cartBadge').textContent = count
  document.getElementById('cartTotal').textContent = '¥' + total
  document.getElementById('cartGo').disabled = !count

  renderCartSheet()
}

function setCate(c) { currentCate = c; render() }

function changeCount(id, delta) {
  cart[id] = (cart[id] || 0) + delta
  if (cart[id] <= 0) delete cart[id]
  saveCart()
  render()
}

function cartTotal() {
  var t = 0
  MENU.forEach(function (d) { t += (cart[d.id] || 0) * d.price })
  return t
}

function saveCart() { store.set('dandan_cart', JSON.stringify(cart)) }
function loadCart() {
  try { cart = JSON.parse(store.get('dandan_cart', '{}')) || {} } catch (e) { cart = {} }
}

// ========== 购物车弹层 ==========
function openCart() {
  document.getElementById('mask').classList.add('open')
  document.getElementById('cartSheet').classList.add('open')
  renderCartSheet()
}
function closeCart() {
  document.getElementById('mask').classList.remove('open')
  document.getElementById('cartSheet').classList.remove('open')
}
function renderCartSheet() {
  var rows = MENU.filter(function (d) { return cart[d.id] }).map(function (d) {
    return '<div class="cart-row">' +
      '<span>' + d.name + ' <span class="price">¥' + d.price + '</span></span>' +
      '<div class="stepper">' +
        '<div class="step-btn" onclick="changeCount(\'' + d.id + '\',-1)">−</div>' +
        '<div class="step-count">' + cart[d.id] + '</div>' +
        '<div class="step-btn add" onclick="changeCount(\'' + d.id + '\',1)">＋</div>' +
      '</div></div>'
  }).join('')
  document.getElementById('cartRows').innerHTML = rows || '<div class="empty">购物车是空的</div>'
  var n = 0
  Object.keys(cart).forEach(function (k) { n += cart[k] })
  document.getElementById('totalCount').textContent = '共 ' + n + ' 件'
  document.getElementById('sheetTotal').textContent = '¥' + cartTotal()
}

// ========== 下单（测试模式：订单存手机本地，不经过服务端、不收钱）==========
function submitOrder() {
  if (!Object.keys(cart).length) return
  var orders = []
  try { orders = JSON.parse(store.get('dandan_orders', '[]')) || [] } catch (e) { orders = [] }
  orders.unshift({
    id: 'D' + new Date().getTime(),
    tableNo: tableNo,
    items: MENU.filter(function (d) { return cart[d.id] }).map(function (d) {
      return { name: d.name, count: cart[d.id], subtotal: d.price * cart[d.id] }
    }),
    total: cartTotal(),
    remark: document.getElementById('remarkInput').value.trim(),
    time: new Date().toLocaleString('zh-CN', { hour12: false }),
    status: '已下单'
  })
  store.set('dandan_orders', JSON.stringify(orders))
  cart = {}
  saveCart()
  closeCart()
  render()
  showToast('下单成功！厨房已收到（测试）')
  document.getElementById('remarkInput').value = ''
  switchView('orderView', document.querySelectorAll('.tab')[1])
}

function renderOrders() {
  var orders = []
  try { orders = JSON.parse(store.get('dandan_orders', '[]')) || [] } catch (e) { orders = [] }
  if (!orders.length) {
    document.getElementById('orderList').innerHTML = '<div class="empty">还没有订单，去点一单吧～</div>'
    return
  }
  document.getElementById('orderList').innerHTML = orders.map(function (o) {
    var items = o.items.map(function (i) {
      return '<div class="order-row"><span>' + i.name + ' × ' + i.count + '</span><span>¥' + i.subtotal + '</span></div>'
    }).join('')
    var remark = o.remark ? '<div class="order-row" style="color:#999">备注：' + o.remark + '</div>' : ''
    return '<div class="order-card">' +
      '<div class="order-head"><span>桌号 ' + o.tableNo + '</span><span class="status">' + o.status + '</span></div>' +
      items + remark +
      '<div class="order-foot"><span>' + o.time + '</span><span>合计 <span class="price">¥' + o.total + '</span></span></div>' +
      '</div>'
  }).join('')
}

// ========== 通用 ==========
function switchView(id, tabEl) {
  var views = document.querySelectorAll('.view')
  for (var i = 0; i < views.length; i++) views[i].classList.remove('active')
  document.getElementById(id).classList.add('active')
  var tabs = document.querySelectorAll('.tab')
  for (var j = 0; j < tabs.length; j++) tabs[j].classList.remove('active')
  tabEl.classList.add('active')
  if (id === 'orderView') renderOrders()
}
function showToast(msg) {
  var t = document.getElementById('toast')
  t.textContent = msg
  t.style.display = 'block'
  setTimeout(function () { t.style.display = 'none' }, 1500)
}

loadCart()
render()
</script>
</body>
</html>
